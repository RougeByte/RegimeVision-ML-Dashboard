services:
  # The Python Backend
  - type: web
    name: regimevision-backend
    env: python
    # We navigate into the backend folder to install requirements and build Go
    buildCommand: pip install -r backend/requirements.txt && go build -o backend/ingestor backend/ingestor.go
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  # The React Frontend
  - type: web
    name: regimevision-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist