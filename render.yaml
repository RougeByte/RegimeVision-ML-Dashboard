services:
  # The Python Backend
  - type: web
    name: regimevision-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && go build -o backend/ingestor backend/ingestor.go
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  # The React Frontend
  - type: web
    name: regimevision-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist